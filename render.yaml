services:
  - type: web
    name: aquashop-pos
    runtime: static
    # ไม่มี build step (เป็น HTML/CSS/JS ล้วน) — ปล่อย buildCommand ว่าง
    buildCommand: ""
    # ไฟล์ทั้งหมดอยู่ที่ root ของ repo
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # ให้ทุกเส้นทางที่ไม่ตรงไฟล์จริง กลับไปที่ index.html
      - type: rewrite
        source: /*
        destination: /index.html
